<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome — Ben-Paul</title>
  <style>
    :root{ --bg:#0f172a; --card:#0b1220; --accent:#7c3aed; --muted:#9ca3af; }
    html,body{height:100%;margin:0;font-family:Segoe UI, Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;color:#e6eef8;background:linear-gradient(180deg,#081029 0%, #071427 100%);display:flex;align-items:center;justify-content:center}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:2.25rem;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6);max-width:720px;width:90%;border:1px solid rgba(255,255,255,0.03)}
    h1{margin:0 0 .25rem;font-size:1.75rem;letter-spacing:-0.5px}
    p.lead{margin:0 0 1rem;color:var(--muted)}
    .actions{display:flex;gap:.75rem;align-items:center;margin-top:1rem}
    .btn{background:linear-gradient(90deg,var(--accent),#4f46e5);color:white;padding:.65rem 1rem;border-radius:8px;border:0;cursor:pointer;font-weight:600;text-decoration:none}
    .btn.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .meta{font-size:.9rem;color:var(--muted);margin-top:.5rem}
    footer{margin-top:.75rem;font-size:.8rem;color:rgba(255,255,255,0.06)}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Welcome to Ben‑Paul</h1>
    <p class="lead">A small demo welcome page. This project lives in the WAMP www folder. Use the button below to open the existing <code>paul.php</code> file.</p>

    <div class="actions">
      <a class="btn" href="paul.php">Open paul.php</a>
      <a class="btn secondary" href="#" onclick="copyUrl();return false">Copy current URL</a>
    </div>

    <div class="meta" id="time">Loading date/time…</div>
    <footer>Rendered on your machine — no external resources required.</footer>
  </main>

  <script>
    // show local date/time
    document.getElementById('time').textContent = 'Local time: ' + new Date().toLocaleString();

    // helper to copy the current URL to clipboard (useful when served)
    function copyUrl(){
      try{
        const url = location.href;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(()=>alert('URL copied to clipboard'));
        } else {
          const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); alert('URL copied to clipboard');
        }
      }catch(e){
        alert('Unable to copy URL');
      }
    }
  </script>
</body>
</html>
